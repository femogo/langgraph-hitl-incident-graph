<path d="M0 34h821" stroke="#30363d"/>
<circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/>
<text x="410.5" y="22" text-anchor="middle" fill="#8b949e" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12">instalación</text>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="13" xml:space="preserve">
<text x="18" y="52" fill="#8b949e"># 1 · Clonar y descargar el modelo</text>
<text x="18" y="71" fill="#7ee787" font-weight="600">$ git clone https://github.com/femogo/langgraph-hitl-incident-graph.git</text>
<text x="18" y="90" fill="#e6edf3">Cloning into 'langgraph-hitl-incident-graph'...</text>
<text x="18" y="109" fill="#7ee787" font-weight="600">$ cd langgraph-hitl-incident-graph</text>
<text x="18" y="128" fill="#7ee787" font-weight="600">$ ollama pull qwen2.5:7b</text>
<text x="18" y="147" fill="#e6edf3">[...]</text>
<text x="18" y="166" fill="#e6edf3">success</text>
<text x="18" y="204" fill="#8b949e"># 2 · Entorno e instalación con uv</text>
<text x="18" y="223" fill="#7ee787" font-weight="600">$ uv sync</text>
<text x="18" y="242" fill="#e6edf3">Using CPython 3.11.15 interpreter at: [...]</text>
<text x="18" y="261" fill="#e6edf3">Creating virtual environment at: .venv</text>
<text x="18" y="280" fill="#e6edf3">Resolved 72 packages in 0.71ms</text>
<text x="18" y="299" fill="#e6edf3">Installed 69 packages in 11ms</text>
<text x="18" y="337" fill="#8b949e"># 3 · Tests</text>
<text x="18" y="356" fill="#7ee787" font-weight="600">$ uv run pytest -q</text>
<text x="18" y="375" fill="#e6edf3">........................                                                 [100%]</text>
<text x="18" y="394" fill="#e6edf3">24 passed in 20.79s</text>
</g></svg>
